  <circle cx="450" cy="500" r="170" fill="#fff" fill-opacity=".72" stroke="#b5451b" stroke-opacity=".18" stroke-width="3"/>
  <path d="M363 532c67-29 108-82 122-159 42 72 60 147 52 225-64-2-122-24-174-66Z" fill="#b5451b" fill-opacity=".14"/>
