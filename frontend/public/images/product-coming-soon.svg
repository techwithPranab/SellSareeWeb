  <text x="450" y="800" text-anchor="middle" fill="#b5451b" font-family="Arial,sans-serif" font-size="28" letter-spacing="8">PP'S AURA</text>
  <text x="450" y="850" text-anchor="middle" fill="#7b675f" font-family="Arial,sans-serif" font-size="22">A new story is about to unfold</text>
