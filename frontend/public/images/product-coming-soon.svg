<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1200" viewBox="0 0 900 1200" role="img" aria-labelledby="title description">
  <title id="title">PP's Aura product coming soon</title>
  <description id="description">A branded placeholder for a product that has not launched yet.</description>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff8f2"/>
      <stop offset="1" stop-color="#f5dfd2"/>
    </linearGradient>
    <pattern id="pattern" width="64" height="64" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <path d="M0 32h64" stroke="#b5451b" stroke-opacity=".08" stroke-width="2"/>
